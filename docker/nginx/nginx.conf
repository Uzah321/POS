# Adapted from deploy.sh's bare-metal nginx config, restructured to flat
# sibling locations — nesting a `\.php$` handler inside the /api location (as
# deploy.sh does, relying on a unix-socket php-fpm on the same host) does not
# reliably catch try_files' internal redirect to /index.php in this setup;
# a top-level \.php$ location does, since nginx re-evaluates all server-level
# locations against an internal redirect's target URI.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Laravel backend — handle /api/* and Sanctum's CSRF-cookie route
    location ~ ^/(api|sanctum)(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        include fastcgi_params;
    }

    # React Router — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
