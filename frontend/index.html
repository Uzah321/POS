<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Touchscreen POS: disable double-tap zoom, pinch zoom, and scroll bounce -->
    <!-- Tablets/phones used as tills always get the full desktop layout (products
         and ticket side by side), laid out 1280px wide and scaled to fit, in any
         orientation. Desktop browsers and Electron ignore this tag. -->
    <meta name="viewport" content="width=1280, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>Core POS</title>
    <style>
      /* Prevent tap highlight and callout on all elements */
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      /* Disable text selection on buttons/tiles but keep it for inputs */
      button, [role="button"] { -webkit-user-select: none; user-select: none; }
      /* Prevent overscroll bounce on touchscreen */
      html, body { overscroll-behavior: none; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
